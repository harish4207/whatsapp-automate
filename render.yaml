services:
  - type: web
    name: whatsapp-nutrition-bot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: 8085
      - key: PORT
        value: 8085
      - key: WHATSAPP_VERIFY_TOKEN
        value: my_access_token_2026
      - key: META_PHONE_NUMBER_ID
        value: "1219522864587242"
      - key: META_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_SECONDARY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: APP_PUBLIC_BASE_URL
        value: https://whatsapp-automate-i8w6.onrender.com
