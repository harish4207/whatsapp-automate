spring.application.name=whatsapp-automation
server.port=${SERVER_PORT:8085}

# ==========================================================
# DATABASE CONFIGURATION (Zero-Setup H2 by default, easily swapped with Supabase/PostgreSQL)
# ==========================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nutritiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console for easy inspection during development at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================================
# META WHATSAPP CLOUD API CREDENTIALS
# ==========================================================
# The secret verification token you define in Meta Developer Dashboard
meta.verify.token=${WHATSAPP_VERIFY_TOKEN:whatsapp_nutrition_secret_2026}

# App Secret found in Meta App Settings -> Basic (used for HMAC-SHA256 signature verification)
meta.app.secret=${META_APP_SECRET:}

# Permanent or Temporary Access Token from Meta Developer Console
meta.access.token=${META_ACCESS_TOKEN:}

# Phone Number ID from Meta API Setup screen
meta.phone.number.id=${META_PHONE_NUMBER_ID:1219522864587242}

# Base URL for WhatsApp Cloud API
meta.api.url=${META_API_URL:https://graph.facebook.com/v19.0}

# ==========================================================
# GOOGLE GEMINI AI CONFIGURATION (Primary + Secondary Failover)
# ==========================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.key.secondary=${GEMINI_API_KEY_SECONDARY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}

# XAI GROK CONFIGURATION (Optional Distributed Text Fallback)
grok.api.key=${GROK_API_KEY:}
grok.api.url=${GROK_API_URL:https://api.x.ai/v1/chat/completions}

# NVIDIA NIM CONFIGURATION (High-Performance LLM Failover - Llama-3.2 11B Vision)
nvidia.nim.api.key=${NVIDIA_NIM_API_KEY:}
nvidia.nim.model=${NVIDIA_NIM_MODEL:meta/llama-3.2-11b-vision-instruct}
nvidia.nim.api.url=${NVIDIA_NIM_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}

# ==========================================================
# PUBLIC APP URL (For serving dynamic meal card images)
# ==========================================================
app.public.base-url=${APP_PUBLIC_BASE_URL:}

# ==========================================================
# LOGGING
# ==========================================================
logging.level.com.yourapp=INFO
logging.level.org.springframework.web=INFO
